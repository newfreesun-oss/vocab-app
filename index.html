<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일본어 조각 섀도잉 타자 연습장</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 👇 PC에서는 중앙 정렬 유지 */
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 750px;       /* PC에서는 최대 750px 고정 */
            box-sizing: border-box;
            text-align: center;
        }

        /* 스마트폰처럼 화면이 좁을 때(768px 이하) */
        @media (max-width: 768px) {
            body {
                /* 👇 모바일에서 맨 위로 붙는 설정 */
                justify-content: flex-start !important; 
                min-height: auto !important;            
            }
            .container {
                padding: 12px;      /* 컨테이너 내부 여백 최적화 */
                border-radius: 12px;
                width: 100%;
                max-width: 100%;    /* 모바일 화면 폭을 넘지 않도록 꽉 채움 */
                margin-top: 0 !important;
            }
            .mode-btn, .stage-btn {
                font-size: 0.9rem;  
                padding: 12px 10px;
            }
            canvas {
                width: 100% !important;
                height: 320px !important; 
            }
            /* 연습 화면 진입 시 카드와 입력창이 화면 밖으로 밀리지 않도록 고정 */
            .card {
                padding: 12px !important;
                margin-bottom: 12px !important;
            }
            input[type="text"] {
                width: 100% !important; /* 입력창이 컨테이너 밖으로 삐져나가지 않게 100% 꽉 채움 */
                box-sizing: border-box !important;
                font-size: 1rem !important;
                padding: 10px !important;
            }
            .box-top-target {
                font-size: 1.05rem !important; /* 모바일에서 글자가 너무 길어 줄바꿈 깨짐 방지 */
                word-break: break-all;
            }
            .box-mid, .box-bottom-input {
                font-size: 0.95rem !important;
                word-break: break-all;
            }
        }
        h2 {
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .mode-select-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #2d2d2d;
            color: white;
            border: 2px solid #444;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .mode-btn.active {
            border-color: #ff6b6b;
            background: #ff6b6b33;
        }
        .extra-toggle-box {
            margin-bottom: 20px;
        }
        .extra-toggle-btn {
            background: #2d2d2d;
            color: #aaa;
            border: 2px dashed #555;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .extra-toggle-btn.active {
            background: #4dabf733;
            border-color: #4dabf7;
            border-style: solid;
            color: #4dabf7;
        }
        .stage-select {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stage-btn {
            background: #2d2d2d;
            color: white;
            border: 2px solid #444;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stage-btn:hover {
            border-color: #ff6b6b;
            background: #383838;
        }
        .stage-btn span {
            color: #4dabf7;
            font-size: 0.95rem;
        }
        .card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 6px solid #ff6b6b;
            text-align: left;
        }
        .row-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .box-top-target {
            font-size: 1.2rem;
            color: #4dabf7;
            font-weight: bold;
            letter-spacing: 1px;
            word-break: break-all;
            margin-bottom: 12px;
        }
        .box-mid {
            font-size: 1.05rem;
            color: #adb5bd;
            margin-bottom: 12px;
        }
        .box-bottom-input {
            font-size: 1.05rem;
            color: #adb5bd;
        }

        .char-correct { color: #51cf66; }
        .char-incorrect { color: #fa5252; text-decoration: underline; }
        .char-missing { color: #868e96; }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid #444;
            background: #2b2b2b;
            color: white;
            text-align: center;
            outline: none;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        input[type="text"]:focus {
            border-color: #ff6b6b;
        }
        input[type="text"]:disabled {
            background: #1a1a1a;
            color: #666;
            border-color: #333;
            cursor: not-allowed;
        }

        .feedback-message {
            font-size: 0.95rem;
            font-weight: bold;
            min-height: 25px;
            margin-bottom: 10px;
        }

        .handwriting-section {
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            width: 100vw;
            background: #1a1a1a;
            padding: 20px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .handwriting-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        canvas {
            background: #ffffff;
            cursor: crosshair;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 95vw;
            height: 560px;
            box-sizing: border-box;
            border-radius: 8px;
        }
        .canvas-tools {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .canvas-btn {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .canvas-btn:hover { background: #444; border-color: #777; }
        
        .canvas-btn.active-tool {
            background: #fab005;
            color: #111;
            border-color: #f59f00;
        }
        .canvas-btn.primary {
            background: #ff6b6b;
            border: none;
        }
        .canvas-btn.primary:hover { background: #fa5252; }

        .progress-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #888;
            font-size: 0.9rem;
            width: 100%;
        }
        .back-btn {
            background: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .back-btn:hover { background: #555; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

	

    <div class="container">
        <!-- 1. 스테이지 및 모드 선택 화면 -->
        <div id="stageView">
            <h2>🇯🇵 일본어 섀도잉 타자 연습 - 모드 선택</h2>
            
            <div class="mode-select-box">
                <button class="mode-btn active" id="modeReadBtn" onclick="setMode('read')">🎵 음 타이핑 모드</button>
                <button class="mode-btn" id="modeMeanBtn" onclick="setMode('mean')">🇰🇷 뜻 타이핑 모드</button>
                <button class="mode-btn" id="modeJpBtn" onclick="setMode('jp')">🇯🇵 일본어 입력 모드</button>
            </div>

<!-- 외부 300문장 전용 독립 낭독 버튼 -->
            <div class="extra-toggle-box">
                <button class="extra-toggle-btn" id="externalPlayBtn" onclick="startExternal300Mode()">📁 외부 300문장 순차 낭독 모드 시작</button>
            </div>

            <!-- 추가 300문장 포함 토글 버튼 -->
            <div class="extra-toggle-box">
                <button class="extra-toggle-btn" id="extraToggleBtn" onclick="toggleExtraSentences()">➕ 추가 300문장 파일 결합 (OFF)</button>
            </div>

            <div class="stage-select">
		<!-- 👇 추가된 단어 연습 버튼 -->
		<button class="stage-btn" onclick="mynichiDAN()">단어 낭독(음성 읽기전용) <span id="MakeWord"> 수첩</span></button>
		<button class="stage-btn" onclick="mynichiLONGDAN()">회화 낭독(음성 읽기전용) <span id="MakeWord"> 수첩</span></button>

		<button class="stage-btn" onclick="MakeAnihogo()">기록하는 일본어(기록전용) <span id="MakeWord"> 수첩</span></button>

	    <button class="stage-btn" onclick="startWordPractice()">단어 연습 (DAN.JS 풀) <span id="countWord"> 180 문장</span></button>
                <button class="stage-btn" onclick="startStage(1)">1단계 (기초 필수 100문장) <span id="count1">40문장</span></button>
                <button class="stage-btn" onclick="startStage(2)">2단계 (1단계 + 확장 일상) <span id="count2">60문장</span></button>
                <button class="stage-btn" onclick="startStage(3)">3단계 (1~2단계 + 심화 응오후 1:32 2026-10-01용) <span id="count3">70문장</span></button>
                <button class="stage-btn" onclick="startStage(4)">4단계 (1~3단계 + 유창성 도전) <span id="count4">76문장</span></button>
                <button class="stage-btn" onclick="startStage(5)">5단계 (1~4단계 + 마스터 랠리) <span id="count5">40문장</span></button>
            </div>
        </div>

        <!-- 2. 실제 타자 연습 화면 -->
        <div id="practiceView" class="hidden">
            <h2 id="stageTitle">단계 연습</h2>
            
            <div class="card" id="cardContainer">
                <div id="slotTop"></div>
                <div id="slotMid"></div>
                <div id="slotBottom"></div>
            </div>

            <!-- 메인 입력창 (타이핑창) -->
            <input type="text" id="userInput" placeholder="전체 문장을 타이핑한 후 엔터키를 누르세요" autocomplete="off">
            
            <!-- 피드백 메시지 영역 -->
            <div class="feedback-message" id="feedbackMsg"></div>
            
            <!-- 진행 상태 및 뒤로가기 -->
            <div class="progress-box">
                <button class="back-btn" onclick="returnToMenu()">← 스테이지 선택으로</button>
                <div id="progressText">문장 1 / 1</div>
            </div>
        </div>
    </div>

    <!-- 일본어 입력 모드일 때만 나타나는 풀스크린 캔버스 영역 -->
    <div id="canvasSectionWrapper" class="hidden">
        <div class="handwriting-section">
            <div class="handwriting-label" id="canvasGuideLabel">✍️ [정답화면]을 누르면 캔버스 맨 하단에 정답이 나타납니다</div>
            <canvas id="drawCanvas" width="1600" height="1120"></canvas>
            <div class="canvas-tools">
                <button class="canvas-btn" id="eraserBtn" onclick="toggleEraser()">🧹 지우개 모드</button>
                <button class="canvas-btn" onclick="clearCanvas()">🗑️ 전체 지우기</button>
                <button class="canvas-btn primary" id="actionBtn" onclick="handleCanvasAction()">정답화면</button>
            </div>
        </div>
        <div style="text-align: center;" class="feedback" id="feedbackText"></div>
    </div>

<!-- 추가모드 저장모드 -->

<!-- 기록하는 일본어 수첩 화면 (전체 화면 모드) -->
<div id="memoPageView" class="hidden">
    <!-- 헤더 영역 -->
    <div class="memo-header">
        <button class="back-btn" onclick="closeMemoPage()">←</button>
        <h2>일본어 기록 수첩</h2>
    </div>

    <!-- 기록 내용이 표시되는 큰 박스 (그림의 큰 네모) -->
    <div id="memoDisplayArea" class="memo-display">
    </div>

    <!-- 하단 버튼 패널 (그림의 4개 버튼) -->
    <div class="memo-button-panel">
        <button class="control-btn" onclick="startVoiceInput()">음성</button>
        <button class="control-btn" onclick="startChatInput()">문자</button>
        <button class="control-btn" onclick="clearMemoDisplay()">삭제</button>
	<button class="control-btn save-btnRED" onclick="saveALLDAN()">저장</button>

        <button class="control-btn save-btn" onclick="saveCurrentMemo()">오답</button>
	<button class="control-btn save-btn" onclick="saveAddMemo()">신규</button>
	<button class="control-btn save-btn" onclick="saveAddMemoALL()">문장</button>
    </div>
</div>

<!-- 간단한 스타일 (기존 사이트와 어울리도록) -->
<style>
	.memo-display {
        width: 100%; /* 기존 상단 라인과 동일하게 가로 폭 맞춤 */
        height: 60px; /* 기존보다 살짝 더 아담한 높이 */
        max-height: 100px; /* 내용이 늘어나도 너무 커지지 않도록 제한 */
        margin: 8px 0;
        padding: 8px 12px;
        border: 2px solid #4CAF50; 
        border-radius: 8px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* 이미지나 텍스트가 무조건 맨 위로 붙도록 설정 */
        align-items: flex-start;
        overflow-y: auto; /* 내용이 많아지면 안에서 스크롤 */
        font-size: 0.95rem;
        color: #333;
        box-sizing: border-box;
    }
    .hidden { display: none !important; }

    /* 헤더 */
    .memo-header {
        display: flex;
        align-items: center;
        padding: 15px;
        background-color: #f8f8f8;
        border-bottom: 1px solid #ddd;
    }
    .back-btn {
        /* --- 투명도 관련 속성 제거 및 초기화 --- */
    opacity: 1 !important;            /* 투명도 완전 불투명 (0.0 ~ 1.0) */
    visibility: visible !important;   /* 숨김 처리 해제 */
    background-color: #ddd !important; /* 버튼 배경색을 확실하게 지정 (투명하지 않은 색) */
    
    /* --- 시인성 확보를 위한 추가 설정 --- */
    color: #333 !important;           /* 버튼 글자색 (배경색과 대비되는 색) */
    border: 1px solid #999 !important; /* 버튼 테두리 */
    filter: none !important;          /* 혹시 모를 투명 필터 제거 */
    
    /* --- 위치 및 배치 설정 --- */
    display: inline-block !important; /* 강제 표시 */
    z-index: 9999 !important;         /* 다른 요소보다 항상 위로 */
    position: relative;               /* 필요시 absolute 등으로 변경 가능 */
    
    /* 기타 버튼 스타일링 */
    padding: 8px 16px;
    font-size: 1.2rem;
    cursor: pointer;
    border-radius: 4px;
    box-sizing: border-box;
    margin-right: 10px; /* 다른 요소와의 간격 */
    }
    .memo-header h2 { margin: 0; font-size: 18px; }
    /* 기록 표시 영역 확대 및 시인성 개선 */
    .memo-display {
        width: 100% !important;
        min-height: 380px !important;      /* 👈 박스 기본 길이를 더 길게 확장했습니다 */

        padding: 10px 14px !important;     /* 👈 상하 여백을 줄여서 글자가 위로 바짝 붙게 함 */

        background-color: #fff;
        display: flex;
        flex-direction: column;

        align-items: stretch !important;
        overflow-y: auto !important;       /* 내용이 많아지면 안쪽 스크롤 */
        font-size: 1.1rem;

        box-sizing: border-box;
    }

    /* 각 항목의 상단 여백을 줄여서 위쪽 공간 활용도 높이기 */

        margin: 0 0 10px 0 !important;
        padding: 10px !important;
        background-color: #f9f9f9;

        border-bottom: 1px solid #e0e0e0 !important;
    }

    /* 하단 버튼 패널 */
    .memo-button-panel {
        display: flex;
        justify-content: space-around;

        border-top: 1px solid #ddd;

        flex: 1; /* 버튼 너비를 균등하게 */

        border: 1px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .control-btn:hover { background-color: #d0d0d0; }
    .save-btn {
        background-color: #4CAF50;
        color: white;
        border: none;
    }

.save-btnRED {
    background-color: #ff6b6b; /* 산뜻하고 화사한 코랄 레드 */

    border: none;
}
.save-btnRED:hover {
    background-color: #fa5252;
}
.memoDisplayArea {
    /* 모바일에서 터치/스크롤이 자연스럽게 작동하도록 설정 */
    touch-action: pan-y;         /* 세로 스크롤은 허용하되 제스처 충돌 방지 */

    pointer-events: auto !important;   /* 마우스 및 터치 이벤트 강제 활성화 */

}

	<script src="addDAN.JS"></script>

    <script>
// 문자 디스플레이 시작 ===============================================================
const memoDisplayArea = document.getElementById("memoDisplayArea");

if (memoDisplayArea) {
    // PC 마우스 클릭 대응
    memoDisplayArea.addEventListener("click", (e) => {
        console.log("창이 마우스로 클릭되었습니다.");
        // 필요한 추가 동작 (예: 입력 포커스 등)
    });

    // 모바일 터치 대응
    memoDisplayArea.addEventListener("touchstart", (e) => {
        console.log("창이 모바일 터치되었습니다.");
        // 모바일에서 터치 시 반응할 로직
    }, { passive: true }); // 성능 최적화를 위한 passive 옵션
}
// 문자 디스플레이 마지막 ===============================================================

// 추가되는 라인===============================================================
// 페이지가 로드될 때 localStorage에 저장된 데이터가 있으면 불러오기

// 여기서부터 문자 관력 입력 조회 저장

function addMemoItemToDisplay(data) {

    const displayArea = document.getElementById("memoDisplayArea");

    if (!displayArea) {

        console.error("memoDisplayArea 요소를 찾을 수 없습니다.");

        return;

    }



    const itemDiv = document.createElement("div");

    itemDiv.className = "memo-item";

    itemDiv.style.margin = "0 0 10px 0";

    itemDiv.style.padding = "10px";

    itemDiv.style.backgroundColor = "#f9f9f9";

    itemDiv.style.borderRadius = "6px";

    itemDiv.style.borderBottom = "1px solid #e0e0e0";

    itemDiv.style.color = "#333";



    // 전체 데이터베이스 통합 (검색용)

    let fullWordDatabase = [];

    if (typeof window.externalSentencesDan !== 'undefined' && Array.isArray(window.externalSentencesDan)) {

        fullWordDatabase = fullWordDatabase.concat(window.externalSentencesDan);

    }

	// 2. addDANadd 통합 (HTML에 있는 애드단 - window나 일반 변수 모두 안전하게 체크)
    const currentAddDan = window.addDANadd || (typeof addDANadd !== 'undefined' ? addDANadd : null);
    if (currentAddDan && Array.isArray(currentAddDan)) {
        fullWordDatabase = fullWordDatabase.concat(currentAddDan);
    }

    if (typeof window.SaveWord !== 'undefined' && Array.isArray(window.SaveWord)) {

        fullWordDatabase = fullWordDatabase.concat(window.SaveWord);

    }



    const meanParts = (data.mean || "").split(/\s+/);



    const jpElement = document.createElement("div");

    jpElement.className = "memo-jp";

    jpElement.style.fontSize = "1.1rem";

    jpElement.style.fontWeight = "bold";

    jpElement.style.color = "#222";



    const meanElement = document.createElement("div");

    meanElement.className = "memo-mean";

    meanElement.style.fontSize = "0.95rem";

    meanElement.style.color = "#0066cc";

    meanElement.style.marginTop = "4px";



    const readElement = document.createElement("div");

    readElement.className = "memo-read";

    readElement.style.fontSize = "0.85rem";

    readElement.style.color = "#666";

    readElement.style.marginTop = "2px";

    readElement.textContent = "음: ";



    // 각 띄어쓰기 조각별로 개별 검색 수행

    meanParts.forEach((meanToken) => {

        const cleanToken = meanToken.toLowerCase();



        // 데이터베이스에서 해당 의미(mean)와 일치하는 단어 찾기

        const foundWord = fullWordDatabase.find(item => {

            const itemMean = item.mean ? String(item.mean).toLowerCase() : "";

            return itemMean === cleanToken;

        });



        let jpToken = "?";

        let readToken = "?";



        if (foundWord) {

            jpToken = foundWord.jp || "?";

            readToken = foundWord.read || "?";

        }



        // 일본어 span 생성

        const jpSpan = document.createElement("span");

        jpSpan.textContent = jpToken + " ";



        // 음 span 생성

        const readSpan = document.createElement("span");

        readSpan.textContent = readToken + " ";



        // '?'인 경우에만 클릭 이벤트 부여

        if (jpToken === "?" || jpToken.includes("?") || readToken === "?" || readToken.includes("?")) {

            jpSpan.style.color = "#ff4444";

            jpSpan.style.cursor = "pointer";

            jpSpan.title = "클릭하여 단어 등록";



            readSpan.style.color = "#ff4444";

            readSpan.style.cursor = "pointer";

            readSpan.title = "클릭하여 단어 등록";



            const clickAction = function() {

                handleQuestionClick(meanToken, jpSpan, readSpan);

            };



            jpSpan.onclick = clickAction;

            readSpan.onclick = clickAction;

        }



        jpElement.appendChild(jpSpan);



        const meanSpan = document.createElement("span");

        meanSpan.textContent = meanToken + " ";

        meanElement.appendChild(meanSpan);



        readElement.appendChild(readSpan);

    });



    itemDiv.appendChild(jpElement);

    itemDiv.appendChild(meanElement);

    itemDiv.appendChild(readElement);



    displayArea.appendChild(itemDiv);

    displayArea.scrollTop = displayArea.scrollHeight;

}





// 4. [문자] 버튼: 띄어쓰기 단위 매칭 및 모르는 단어는 위/아래 모두 '?' 처리하는 함수

function startChatInput() {

    const userInput = prompt("추가할 문장 또는 해석을 입력하세요:");

    if (!userInput || userInput.trim() === "") return;



    // 띄어쓰기(스페이스) 단위로 어절 쪼개기

    const queryTokens = userInput.trim().split(/\s+/);



    // 전체 데이터베이스 결합

    let fullWordDatabase = [];

    if (typeof window.externalSentencesDan !== 'undefined' && Array.isArray(window.externalSentencesDan)) {

        fullWordDatabase = fullWordDatabase.concat(window.externalSentencesDan);

    }

    if (typeof window.SaveWord !== 'undefined' && Array.isArray(window.SaveWord)) {

        fullWordDatabase = fullWordDatabase.concat(window.SaveWord);

    }



    let translatedJpParts = [];

    let translatedReadParts = [];



    // 각 띄어쓰기 조각별로 단어장(mean)과 매칭 시도

    queryTokens.forEach(token => {

        const cleanToken = token.toLowerCase();

        

        const foundWord = fullWordDatabase.find(item => {

            const mean = item.mean ? String(item.mean).toLowerCase() : "";

            return mean === cleanToken || mean.includes(cleanToken);

        });



        if (foundWord) {

            // [매칭 성공] 단어장에 있는 경우 -> 일본어와 음 가져오기

            translatedJpParts.push(foundWord.jp || token);

            translatedReadParts.push(foundWord.read || "");

        } else {

            // [매칭 실패 / 모르는 단어] -> 위쪽과 아래쪽(음) 모두 "?" 로 표기

            translatedJpParts.push("?");

            translatedReadParts.push("?");

        }

    });



    // 최종 3단 구조 데이터 조합

    const memoData = {

        jp: translatedJpParts.join(" "),       // 맨 위: 매칭된 일본어 및 모르는 부분은 "?"

        mean: userInput,                        // 중간: 내가 입력한 원본 한글 문장

        read: translatedReadParts.join(" ")     // 젤 밑: 매칭된 음 및 모르는 부분은 "?"

    };



    // 3단 구조로 화면에 출력

    addMemoItemToDisplay(memoData);

}





function handleQuestionClick(targetMean, jpSpanTarget, readSpanTarget) {
    // 1. 팝업으로 일본어 원문 입력 받기
    const inputJp = prompt(`[단어 등록] '${targetMean}'의 일본어 원문을 입력하세요:`, "");
    if (!inputJp || !inputJp.trim()) return;

    // 2. 팝업으로 음(발음) 입력 받기
    const inputRead = prompt(`[단어 등록] '${targetMean}'의 음(발음)을 입력하세요:`, "");
    if (inputRead === null) return; // 취소 시 종료

    const cleanJp = inputJp.trim();
    const cleanMean = targetMean.trim();
    const cleanRead = inputRead.trim() !== "" ? inputRead.trim() : cleanJp;

    // ----------------------------------------------------
    // [1] 기존 SaveWord 저장 로직 (평소대로 무조건 정상 저장)
    // ----------------------------------------------------
    let savedWords = [];
    try {
        const localData = localStorage.getItem('SaveWord');
        if (localData) {
            savedWords = JSON.parse(localData);
        } else if (window.SaveWord && Array.isArray(window.SaveWord)) {
            savedWords = window.SaveWord;
        }
    } catch (e) {
        savedWords = [];
    }

    savedWords.push({
        jp: cleanJp,
        mean: cleanMean,
        read: cleanRead
    });

    localStorage.setItem('SaveWord', JSON.stringify(savedWords));
    window.SaveWord = savedWords;

    // ----------------------------------------------------
    // [2] AddWord 저장소 전용: 일본어/뜻 조회 후 "둘 다 없을 때만" 저장!
    // ----------------------------------------------------
    let addWords = [];
    try {
        const localAddData = localStorage.getItem('AddWord');
        if (localAddData) {
            addWords = JSON.parse(localAddData);
        } else if (window.AddWord && Array.isArray(window.AddWord)) {
            addWords = window.AddWord;
        }
    } catch (e) {
        addWords = [];
    }

    // 각각 따로 조회
    const hasJpInAdd = addWords.some(item => item.jp && item.jp.trim() === cleanJp);
    const hasMeanInAdd = addWords.some(item => item.mean && item.mean.trim() === cleanMean);

    let isAddWordSaved = false;

    // 룰 적용: 일본어 있거나, 뜻 있거나, 둘 다 있으면 패스! 오직 "둘 다 없을 때만" 저장
    if (!hasJpInAdd && !hasMeanInAdd) {
        addWords.push({
            jp: cleanJp,
            mean: cleanMean,
            read: cleanRead
        });

        localStorage.setItem('AddWord', JSON.stringify(addWords));
        window.AddWord = addWords;
        isAddWordSaved = true;
        console.log("일본어와 뜻 둘 다 없으므로 AddWord에 신규 저장됨:", cleanJp, cleanMean);
    } else {
        console.log("일본어 또는 뜻이 이미 존재하므로 AddWord 저장을 패스합니다.");
    }

    // 5. 화면의 '?' 요소들을 입력한 값으로 즉시 교체
    if (jpSpanTarget) {
        jpSpanTarget.textContent = cleanJp + " ";
        jpSpanTarget.style.color = "#222";
        jpSpanTarget.style.cursor = "default";
        jpSpanTarget.onclick = null;
    }

    if (readSpanTarget) {
        readSpanTarget.textContent = cleanRead + " ";
        readSpanTarget.style.color = "#666";
        readSpanTarget.style.cursor = "default";
        readSpanTarget.onclick = null;
    }

    // 6. 확인용 알림
    let listText = `--- ['${cleanMean}' 등록 완료] ---\n`;
    if (isAddWordSaved) {
        listText += `✨ [AddWord 추가] 일본어와 뜻이 둘 다 애드단에 없어 신규로 저장되었습니다!\n\n`;
    } else {
        listText += `🛡 [AddWord 패스] 일본어 또는 뜻 중 하나(또는 둘 다)가 이미 존재하여 애드단 저장은 패스되었습니다.\n\n`;
    }
    
    savedWords.forEach((item, index) => {
        listText += `${index + 1}. [원문] ${item.jp} | [뜻] ${item.mean} | [발음] ${item.read}\n`;
    });

    alert(listText);
}

function handleQuestionClick(targetMean, jpSpanTarget, readSpanTarget) {
    // 1. 팝업으로 일본어 원문 입력 받기
    const inputJp = prompt(`[단어 등록] '${targetMean}'의 일본어 원문을 입력하세요:`, "");
    if (!inputJp || !inputJp.trim()) return;

    // 2. 팝업으로 음(발음) 입력 받기
    const inputRead = prompt(`[단어 등록] '${targetMean}'의 음(발음)을 입력하세요:`, "");
    if (inputRead === null) return; // 취소 시 종료

    const cleanJp = inputJp.trim();
    const cleanMean = targetMean.trim();
    const cleanRead = inputRead.trim() !== "" ? inputRead.trim() : cleanJp;

    const newItem = {
        jp: cleanJp,
        mean: cleanMean,
        read: cleanRead
    };

      // ==========================================
    // [1] 핵심 조회: 내가 입력한 일본어가 익스텐션 단어장에 있는가?
    // ==========================================
    let existsInExternal = false;
    if (typeof window.externalSentencesDan !== 'undefined' && Array.isArray(window.externalSentencesDan)) {
        existsInExternal = window.externalSentencesDan.some(item => {
            const itemJp = (typeof item === 'string') ? item : item.jp;
            return itemJp && itemJp.trim() === cleanJp;
        });
    }

	
    // ==========================================
    // [2] 메인 저장소(SaveWord)는 뜻이 다르므로 무조건 저장
    // ==========================================
    let savedWords = [];
    try {
        const localData = localStorage.getItem('SaveWord');
        if (localData) {
            savedWords = JSON.parse(localData);
        } else if (window.SaveWord && Array.isArray(window.SaveWord)) {
            savedWords = window.SaveWord;
        }
    } catch (e) {
        savedWords = [];
    }

    savedWords.push(newItem);
    localStorage.setItem('SaveWord', JSON.stringify(savedWords));
    window.SaveWord = savedWords;

    // ==========================================
    // [3] 보조 저장소(AddWord) 판별 및 저장
    // ==========================================
    let addWords = [];
    try {
        const localAddData = localStorage.getItem('AddWord');
        if (localAddData) {
            addWords = JSON.parse(localAddData);
        } else if (window.AddWord && Array.isArray(window.AddWord)) {
            addWords = window.AddWord;
        }
    } catch (e) {
        addWords = [];
    }

    let isAddWordSaved = false;

    // 익스텐션 단어장에 없다면? -> 보조 저장소에도 저장 (둘 다 저장)
    if (!existsInExternal) {
        // 보조 저장소 내 중복 방지 체크 한번 더
        const alreadyInAdd = addWords.some(item => {
            const itemJp = (typeof item === 'string') ? item : item.jp;
            return itemJp && itemJp.trim() === cleanJp;
        });

        if (!alreadyInAdd) {
            addWords.push(newItem);
            localStorage.setItem('AddWord', JSON.stringify(addWords));
            window.AddWord = addWords;
            isAddWordSaved = true;
        }
    } 
    // 익스텐션 단어장에 이미 있다면? -> 보조 저장은 패스 (메인에만 저장)
    else {
        isAddWordSaved = false;
    }


// 4번 기능 삭제

    // ==========================================
    // [5] 화면 UI 업데이트 및 결과 안내
    // ==========================================
    if (jpSpanTarget) {
        jpSpanTarget.textContent = cleanJp + " ";
        jpSpanTarget.style.color = "#222";
        jpSpanTarget.style.cursor = "default";
        jpSpanTarget.onclick = null;
    }

    if (readSpanTarget) {
        readSpanTarget.textContent = cleanRead + " ";
        readSpanTarget.style.color = "#666";
        readSpanTarget.style.cursor = "default";
        readSpanTarget.onclick = null;
    }

    let listText = `--- ['${cleanMean}' 등록 완료] ---\n`;
    if (isAddWordSaved) {
        listText += `✨ [둘 다 저장] 익스텐션 단어장에 없던 단어이므로 메인과 보조 저장소 모두에 저장되었습니다!\n`;
    } else {
        listText += `🛡 [하나만 저장] 익스텐션 단어장에 이미 존재하는 일본어이므로 보조 저장은 패스하고 메인 저장소에만 뜻이 추가되었습니다.\n`;
    }
    
    alert(listText);
}

// 1. 메인 저장소(SaveWord) 전용 백업 함수
function saveMainMemo() {
    let saveWords = [];
    try {
        const localData = localStorage.getItem('SaveWord');
        if (localData) {
            saveWords = JSON.parse(localData);
        } else if (window.SaveWord && Array.isArray(window.SaveWord)) {
            saveWords = window.SaveWord;
        }
    } catch (e) {
        saveWords = [];
    }

    if (saveWords.length === 0) {
        alert("백업할 메인 저장소(SaveWord) 데이터가 없습니다.");
        return;
    }

    const isConfirm = confirm(`메인 저장소(SaveWord)의 ${saveWords.length}개 항목을 'addPlusDAN.JS' 파일로 백업하고 저장소를 비우시겠습니까?`);
    if (!isConfirm) return;

    try {
        const fileContent = `window.SaveWord = ${JSON.stringify(saveWords)};`;
        const blob = new Blob([fileContent], { type: 'text/javascript;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "addPlusDAN.txt";
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);

        localStorage.removeItem('SaveWord');
        window.SaveWord = [];

        alert("메인 단어 백업이 완료되었습니다!");
    } catch (error) {
        console.error("메인 백업 오류:", error);
        alert("백업 중 오류가 발생했습니다.");
    }
}

function saveALLDAN() {
    // 1. 전체 페이지가 아니라, 진짜 문장들이 누적되는 '디스플레이 영역(memoDisplayArea)'만 정확히 지목합니다.
    const displayArea = document.getElementById('memoDisplayArea');
    
    if (!displayArea) {
        alert("⚠️ 기록 디스플레이 영역을 찾지 못했습니다.");
        return;
    }

    // 디스플레이 안의 개별 문장/아이템 블록들을 모두 찾습니다. (없으면 디스플레이 전체 박스 자체를 대상으로 삼음)
    const cardContainers = displayArea.querySelectorAll('.memo-item, div, p');
    
    let sumAddWords = [];
    try {
        const localSumData = localStorage.getItem('sumAddWord');
        if (localSumData) {
            sumAddWords = JSON.parse(localSumData);
        } else if (window.sumAddWord && Array.isArray(window.sumAddWord)) {
            sumAddWords = window.sumAddWord;
        }
    } catch (e) {
        sumAddWords = [];
    }

    let savedCount = 0;
    let skippedCount = 0;

    // 2. 각 영역을 돌며 텍스트 파싱
    cardContainers.forEach(card => {
        const textContent = card.innerText || "";
        if (!textContent.trim()) return;

        // [조건 1] 화면에 '?'가 단 하나라도 있으면 미완성 문장이므로 패스!
        if (textContent.includes('?')) {
            return; 
        }

        // 줄바꿈 기준으로 쪼개기
        const lines = textContent.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        // 정확히 3줄 세트(일본어, 뜻, 음) 형태를 갖춘 것만 인정
        if (lines.length < 3) return; 

        const fullJp = lines[0];
        const fullMean = lines[1];
        
        // [핵심 요구사항] '음:' 이나 '읽기:' 같은 글자가 붙어있으면 깔끔하게 제거!
        let fullRead = lines[2].replace(/^(음|읽기)\s*[:：]\s*/, '').trim();

        // [조건 2] 메뉴 이름, 버튼 글자, UI 안내 문구 등은 확실하게 필터링
        const ignoreWords = ["음성", "문자", "삭제", "정답화면", "지우개", "←", "수첩"];
        if (ignoreWords.some(word => fullJp.includes(word) || fullMean.includes(word))) {
            return; // UI 메뉴 글자면 저장 대상에서 제외
        }

        // [조건 3] 익스텐션 단어장(externalSentences 또는 externalSentencesDan)에 이미 있는 일본어라면 제외
        let existsInExternal = false;
        const targetExternalList = window.externalSentences || window.externalSentencesDan;
        
        if (targetExternalList && Array.isArray(targetExternalList)) {
            existsInExternal = targetExternalList.some(item => {
                const itemJp = (typeof item === 'string') ? item : item.jp;
                return itemJp && itemJp.trim() === fullJp.trim();
            });
        }

        if (existsInExternal) {
            skippedCount++;
            return;
        }

        // 최종 저장할 깔끔한 세트 구조 (음: 글자 빠짐 확인 완료)
        const finalSentenceRow = {
            jp: fullJp,
            mean: fullMean,
            read: fullRead
        };

        // sumAddWord 내 중복 방지 체크 후 추가/갱신
        const existingIndex = sumAddWords.findIndex(item => item.jp === fullJp);
        if (existingIndex !== -1) {
            sumAddWords[existingIndex] = finalSentenceRow;
        } else {
            sumAddWords.push(finalSentenceRow);
        }

        savedCount++;
    });

    // 3. 최종 저장소 반영
    if (savedCount > 0) {
        localStorage.setItem('sumAddWord', JSON.stringify(sumAddWords));
        window.sumAddWord = sumAddWords;
        alert(`✨ 저장 완료!\n- 새로 저장된 문장: ${savedCount}개\n- 익스텐션 단어장에 있어 제외된 문장: ${skippedCount}개`);
    } else {
        alert(`⚠️ 저장할 수 있는 완성된 문장이 없습니다.\n(디스플레이에 '?'가 없는 완벽한 문장 세트만 저장됩니다.)`);
    }
}

let customPool = [];

// 1. 단어 모드 버튼 클릭 시

// 3. 공통 초기화 및 데이터 로드 함수
function startCustomReadingMode(targetArray, modeTitleName) {
    customPool = [];

    try {
        let rawData = targetArray || [];
        
        if (Array.isArray(rawData) && rawData.length > 0) {
            rawData.forEach(item => {
                if (item) {
                    customPool.push({
                        jp: String(item.jp || "").trim(),
                        mean: String(item.mean || "").trim(),
                        read: String(item.read || "").trim()
                    });
                }
            });
        }
        
        if (customPool.length === 0) {
            alert("데이터가 비어있거나 올바르지 않습니다.");
            return;
        }

        isCustomMode = true;
        customCurrentIndex = 0;
        
        if (typeof stageView !== 'undefined' && stageView) stageView.classList.add("hidden");
        if (typeof practiceView !== 'undefined' && practiceView) practiceView.classList.remove("hidden");
        if (typeof canvasSectionWrapper !== 'undefined' && canvasSectionWrapper) canvasSectionWrapper.classList.add("hidden");
        
        loadCustomSentence(modeTitleName);

    } catch (error) {
        console.error("데이터 처리 오류:", error);
        alert("데이터 로드 중 오류가 발생했습니다.");
    }
}

// 4. 순차적으로 문장을 표시하고 일본어만 음성 재생 후 여유 있는 대기 시간 부여
function loadCustomSentence(modeTitleName) {
    if (!isCustomMode) return;

    if (typeof userInput !== 'undefined' && userInput) {
        userInput.disabled = true;
        userInput.value = "";
    }

    if (customCurrentIndex >= customPool.length) {
        if (typeof practiceView !== 'undefined' && practiceView) {
            practiceView.innerHTML = `
                <h2>🎉 ${modeTitleName} 완료!</h2>
                <p style="font-size: 1.2rem; color: #4dabf7; margin-bottom: 20px;">모든 항목을 순차적으로 완주했습니다!</p>
                <button onclick="location.reload()" style="padding: 12px 25px; font-size: 1rem; background: #ff6b6b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">메뉴로 돌아가기</button>
            `;
        }
        return;
    }

    const current = customPool[customCurrentIndex];
    
    if (typeof stageTitle !== 'undefined' && stageTitle) stageTitle.innerText = `📁 ${modeTitleName}`;
    if (typeof progressText !== 'undefined' && progressText) progressText.innerText = `진행: ${customCurrentIndex + 1} / ${customPool.length}`;
    
    if (typeof slotTop !== 'undefined' && slotTop) slotTop.innerHTML = `<div class="row-label">일본어 원문</div><div class="box-top-target">${current.jp}</div>`;
    if (typeof slotMid !== 'undefined' && slotMid) slotMid.innerHTML = `<div class="row-label">한국어 해석</div><div class="box-mid">${current.mean}</div>`;
    if (typeof slotBottom !== 'undefined' && slotBottom) slotBottom.innerHTML = `<div class="row-label">발음</div><div class="box-bottom-input">${current.read}</div>`;

    if (typeof feedbackMsg !== 'undefined' && feedbackMsg) {
        feedbackMsg.style.color = "#4dabf7";
        feedbackMsg.innerText = "🔊 일본어 음성 출력 중...";
    }

    // 오직 일본어만 읽어주는 전용 함수 호출
    playJapaneseOnly(current.jp, () => {
        if (customTimer) clearTimeout(customTimer);
        
        // ⏱️ 대기 시간을 기존보다 넉넉하게 3.5초(3500밀리초)로 늘렸습니다. (필요시 시간 수정 가능)
        customTimer = setTimeout(() => {
            if (isCustomMode) {
                customCurrentIndex++;
                loadCustomSentence(modeTitleName);
            }
        }, 7000); 
    });
}

// 5. 일본어만 재생하는 독립 함수
function playJapaneseOnly(text, onComplete) {
    if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
    }

    window.speechSynthesis.cancel(); // 이전 음성 취소

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.9; // 속도 조절 (필요시 0.8 등으로 조절 가능)

    utter.onend = () => {
        if (onComplete) onComplete();
    };
    utter.onerror = () => {
        if (onComplete) onComplete();
    };

    window.speechSynthesis.speak(utter);
}

	function playJapanese(text) {
    // 브라우저가 음성 합성을 지원하는지 확인
    if (!('speechSynthesis' in window)) {
        alert("이 브라우저는 음성 출력을 지원하지 않습니다.");
        return;
    }

    // 기존에 재생 중이던 음성이 있다면 중지
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP'; // 일본어로 설정
    utterance.rate = 1.0;   // 배속 (0.5 ~ 2.0, 원하시면 속도 조절 가능)
    utterance.pitch = 1.0;  // 음고 (목소리 톤)

    // 브라우저에 등록된 일본어 목소리(Voice) 자동 지정
    const voices = window.speechSynthesis.getVoices();
    const jpVoice = voices.find(voice => voice.lang === 'ja-JP' || voice.lang === 'ja_JP');
    if (jpVoice) {
        utterance.voice = jpVoice;
    }

    window.speechSynthesis.speak(utterance);
}

       function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

                    ? currentStageSentences 
                    : [];

    let rawData = baseList.length > 0 ? baseList : addData;

    // 4. 추가 버튼(includeExtra)이 켜져있다면 extraPool도 함께 누적
    if (typeof includeExtra !== 'undefined' && includeExtra && typeof extraPool !== 'undefined' && extraPool.length > 0) {
        rawData = rawData.concat(extraPool);
    }
    
    // 만약 이미 baseList가 있는데여기에 danList를 버튼 누를 때마다 추가하고 싶다면 아래와 같이 명시적으로 더해줄 수도 있습니다.

    /*
    if (addData.length > 0) {
        rawData = baseList.concat(addData);
    }
    */

    if (Array.isArray(rawData) && rawData.length > 0) {
        currentStageSentences = shuffleArray(rawData.map(item => ({
            jp: String(item.jp || "").trim(),
            mean: String(item.mean || "").trim(),
            read: String(item.read || "").trim()
        })));

        const countSpan = document.getElementById("countWord");
        if (countSpan) {
            countSpan.textContent = `${currentStageSentences.length} 문장`;
        }

        currentIndex = 0;

            stageTitle.innerText = `단어 연습 (총 ${currentStageSentences.length}문장)`;

        ctx.lineCap = "round";

        function toggleEraser() {
            isEraser = !isEraser;
            const btn = document.getElementById("eraserBtn");
            if (isEraser) {

        // ⭐ 마우스와 모바일 터치 좌표를 모두 처리하는 공용 함수
        function getTouchPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            // 터치 이벤트일 경우 첫 번째 손가락 좌표(e.touches[0]), 마우스일 경우 e.clientX 사용
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // 그리기/지우기 공통 로직 처리 함수
        function processDrawing(pos) {
            if (isEraser) {
                ctx.save();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 35;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.restore();
            } else {
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = penWidth;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
        }

        // ── [마우스 이벤트 리스너] ──
        canvas.addEventListener("mousedown", (e) => {
            isDrawing = true;
            const pos = getTouchPos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isDrawing) return;
            const pos = getTouchPos(canvas, e);
            processDrawing(pos);
        });

        window.addEventListener("mouseup", () => {
            isDrawing = false;
        });

        // ── [모바일 터치 이벤트 리스터 (추가됨)] ──
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault(); // 손가락으로 글씨 쓸 때 화면이 위아래로 움직이는 현상 방지
            isDrawing = true;
            const pos = getTouchPos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const pos = getTouchPos(canvas, e);
            processDrawing(pos);
        }, { passive: false });

        window.addEventListener("touchend", () => {
            isDrawing = false;
        });

    if (externalCurrentIndex >= external300Pool.length) {
        practiceView.innerHTML = `
            <h2>🎉 300문장 낭독 완료!</h2>
            <p style="font-size: 1.2rem; color: #4dabf7; margin-bottom: 20px;">모든 문장을 순차적으로 읽었습니다.</p>

        `;
        return;
    }

    const current = external300Pool[externalCurrentIndex];
    
    if (stageTitle) stageTitle.innerText = `📁 외부 300문장 순차 낭독 모드`;
    if (progressText) progressText.innerText = `문장 ${externalCurrentIndex + 1} / ${external300Pool.length}`;
    
    if (slotTop) slotTop.innerHTML = `<div class="row-label">일본어 원문</div><div class="box-top-target">${current.jp}</div>`;
    if (slotMid) slotMid.innerHTML = `<div class="row-label">한국어 해석</div><div class="box-mid">${current.mean}</div>`;
    if (slotBottom) slotBottom.innerHTML = `<div class="row-label">발음</div><div class="box-bottom-input">${current.read}</div>`;

    if (feedbackMsg) {
        feedbackMsg.style.color = "#4dabf7";
        feedbackMsg.innerText = "🔊 일본어 및 한국어 음성 출력 중...";
    }

    // 1단계: 일본어 음성 재생 후, 끝나면 한국어 음성 이어서 재생
    playBilingualAudio(current.jp, current.mean, () => {
        // 음성 재생이 모두 끝난 뒤 1.5초 대기 후 다음 문장으로 이동
        if (externalTimer) clearTimeout(externalTimer);
        externalTimer = setTimeout(() => {
            if (isExternalMode) {
                externalCurrentIndex++;
                loadExternalSentence();
            }
        }, 1500);
    });
}

// 3. 일본어와 한국어를 순서대로 읽어주는 보조 함수
function playBilingualAudio(jpText, krText, onComplete) {
    if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
    }

    window.speechSynthesis.cancel(); // 이전 음성 취소

    // 일본어 먼저 재생
    const jpUtter = new SpeechSynthesisUtterance(jpText);
    jpUtter.lang = 'ja-JP';
    jpUtter.rate = 0.9;

    jpUtter.onend = () => {
        setTimeout(() => {
            const krUtter = new SpeechSynthesisUtterance(krText);
            krUtter.lang = 'ko-KR';
            krUtter.rate = 1.0;

            krUtter.onend = () => {
                if (onComplete) onComplete();
            };
            krUtter.onerror = () => {
                if (onComplete) onComplete();
            };

            window.speechSynthesis.speak(krUtter);
        }, 500);
    };

    jpUtter.onerror = () => {
        if (onComplete) onComplete();
    };

    window.speechSynthesis.speak(jpUtter);
}
